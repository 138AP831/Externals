# OpenJarvis config for this repo (used by ./jarvis.sh via OPENJARVIS_CONFIG).
# API keys live in .env, never here.

[engine]
default = "cloud"

[intelligence]
# Fast and reliable. Heavier options your key can use:
#   gemini-3.8-flash, gemini-3.5-flash, gemini-3.1-pro-preview, gemini-2.5-pro
default_model = "gemini-3.5-flash-lite"

[agent]
default_agent = "simple"   # use -a orchestrator / native_react for tools

[server]
host = "127.0.0.1"
port = 8000

[analytics]
enabled = false
choice_recorded = true
