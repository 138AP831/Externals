# Render Blueprint: OpenJarvis web app + API, powered by Google Gemini.
# Deploys src/openjarvis/server/app.py (with the built web UI) via
# deploy/docker/Dockerfile. See SETUP.md → "Phone app (cloud)".
services:
  - type: web
    name: jarvis
    runtime: docker
    plan: free
    region: oregon
    branch: master
    dockerfilePath: ./deploy/docker/Dockerfile
    dockerContext: .
    # Render's default web port is 10000; Docker commands do not expand $PORT,
    # so PORT below and --port here must match.
    dockerCommand: serve --host 0.0.0.0 --port 10000 --engine cloud --model gemini-3.5-flash-lite
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "10000"
      # Password for your Jarvis. Required: the server refuses to listen on a
      # public address without it. Choose a long random string.
      - key: OPENJARVIS_API_KEY
        sync: false
      # Your Google AI Studio key.
      - key: GEMINI_API_KEY
        sync: false
      # The free plan's disk is wiped on every restart/deploy, so chat history
      # stored here is not permanent.
      - key: OPENJARVIS_HOME
        value: /home/openjarvis/.openjarvis
